name: Update Metadata

on:
  workflow_dispatch:
    inputs:
      releaseDescription:
        required: true

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_DESCRIPTION: ${{ github.event.inputs.releaseDescription }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install dependencies and build
        run: |
          pnpm install
          pnpm build

      - name: Tests
        run: |
          pnpm test

      - name: Update metadata.yaml
        id: update-metadata
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const message = JSON.stringify(process.env.RELEASE_DESCRIPTION);
          const newVersion = `  - sha: ${sha}\n    changeNotes: ${message}`;
          const metadata = fs.readFileSync('metadata.yaml', 'utf8');
          fs.writeFileSync('metadata.yaml', metadata.replace(/^versions:\r?$/m, () => `versions:\n${newVersion}`));
          console.log(`New version info to be added:\n${newVersion}`);
          JS

      - name: Lint metadata.yaml
        id: lint-metadata
        run: |
          npx yaml-lint metadata.yaml

      - name: Create Github Release
        run: |
          # Extract just the SHA for the tag name
          SHA=$(git rev-parse --short=5 HEAD)
          GIT_TAG_NAME="$SHA"
          TITLE="GTM Template Version: $SHA"
          
          # Create the named template file
          TEMPLATE_NAME="amplitude-gtm.$SHA.tpl"
          cp template.tpl "$TEMPLATE_NAME"
          
          # Determine if this should be a draft
          IS_DRAFT=""
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            IS_DRAFT="--draft"
          fi
          
          # Create the release using GitHub CLI
          gh release create "$GIT_TAG_NAME" \
            --title "$TITLE" \
            --notes "$RELEASE_DESCRIPTION" \
            $IS_DRAFT \
            --repo ${{ github.repository }} \
            "$TEMPLATE_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config --local user.email amplitude-sdk-bot@users.noreply.github.com
          git config --local user.name amplitude-sdk-bot
          git add metadata.yaml
          git commit -m "Update metadata.yaml" || exit 0  # Exit 0 if no changes
          git push
